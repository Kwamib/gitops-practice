# Preview: a short-lived copy of staging, to show a change to someone (Lesson 8).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookshop-preview
  namespace: argocd
  finalizers:
    # Deleting this Application deletes everything it deployed, too.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kwamib/gitops-practice.git
    targetRevision: main
    path: charts/bookshop
    helm:
      releaseName: bookshop
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bookshop-preview
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
