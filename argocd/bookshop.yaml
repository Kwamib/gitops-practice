# Lesson 3: the bookshop, deployed from this repository's apps/bookshop folder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookshop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kwamib/gitops-practice.git
    targetRevision: main
    path: apps/bookshop
  destination:
    server: https://kubernetes.default.svc
    namespace: bookshop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
