# cert-manager (Security track, Lesson 8): requests, renews and stores TLS certificates
# as Kubernetes Secrets, from whichever issuer a Certificate names.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.2
    helm:
      releaseName: cert-manager
      valuesObject:
        # Install the Certificate, Issuer and other custom resource definitions with the chart.
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The definitions are too big for kubectl's client-side apply.
      - ServerSideApply=true
