# Monitoring (Monitoring track, Lesson 1): Prometheus, Alertmanager, Grafana and the
# exporters that feed them, from the kube-prometheus-stack Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.18.0
    helm:
      releaseName: monitoring
      valuesObject:
        grafana:
          admin:
            # Use the sealed login from apps/monitoring, rather than a password the
            # chart makes up again every time Argo CD renders it.
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # Logs, from Loki (Lesson 9), beside Prometheus in Explore and on dashboards.
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              access: proxy
        # Where alerts go, how they're grouped, and what hides what (Lesson 8).
        alertmanager:
          alertmanagerSpec:
            # Mount the sealed Slack address at /etc/alertmanager/secrets/alertmanager-slack/url.
            secrets:
              - alertmanager-slack
          config:
            global:
              resolve_timeout: 5m
            route:
              # Everything goes to the bookshop team, unless a route below says otherwise.
              receiver: bookshop-team
              # One message per alert name and address: staging's problems separate from production's.
              group_by: [alertname, instance]
              group_wait: 30s       # wait this long after the first alert of a group, for others to join it
              group_interval: 1m    # then send changes to the group at most this often
              repeat_interval: 4h   # and remind about a group still firing this often
              routes:
                # Watchdog always fires and InfoInhibitor is machinery: nobody needs a message (Lesson 10 uses Watchdog).
                - receiver: "null"
                  matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
                # info is worth knowing, not worth a message (Lesson 7).
                - receiver: "null"
                  matchers: ['severity = "info"']
            inhibit_rules:
              # A shop that isn't answering doesn't have the right banner either: one cause, one message.
              - source_matchers: ['alertname = "BookshopDown"']
                target_matchers: ['alertname = "BookshopPageWrong"']
                equal: [instance]
              # The chart's defaults: a critical alert hides the warning about the same thing,
              - source_matchers: ['severity = "critical"']
                target_matchers: ['severity =~ "warning|info"']
                equal: [namespace, alertname]
              # and InfoInhibitor hides info alerts in its namespace.
              - source_matchers: ['alertname = "InfoInhibitor"']
                target_matchers: ['severity = "info"']
                equal: [namespace]
            receivers:
              - name: "null"
              - name: bookshop-team
                # Both: the in-cluster receiver, and Slack.
                webhook_configs:
                  - url: http://alert-receiver.monitoring.svc:8080/
                    send_resolved: true
                slack_configs:
                  # The webhook address is a password: it's read from a file, mounted from the sealed Secret.
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
                    send_resolved: true
                    title: '{{ if eq .Status "firing" }}Firing{{ else }}Resolved{{ end }}: {{ .CommonLabels.alertname }}'
                    text: '{{ range .Alerts }}{{ .Annotations.summary }} ({{ .Labels.severity }}): {{ .Annotations.description }}{{ "\n" }}{{ end }}'
            templates:
              - /etc/alertmanager/config/*.tmpl
        # kind keeps these control-plane parts unreachable (Lesson 1), so their targets
        # are always down and their alerts always fire. Stop scraping them (Lesson 7).
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            # And drop the alert rules about them.
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
          disabled:
            # kind's nodes don't sync their clocks; nothing to act on, here.
            NodeClockNotSynchronising: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Some of the chart's definitions are too large for the older way of applying,
      # as with Argo CD's own install in the Argo CD track's Lesson 1.
      - ServerSideApply=true
