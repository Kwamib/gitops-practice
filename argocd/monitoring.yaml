# Monitoring (Monitoring track, Lesson 1): Prometheus, Alertmanager, Grafana and the
# exporters that feed them, from the kube-prometheus-stack Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.18.0
    helm:
      releaseName: monitoring
      valuesObject:
        grafana:
          admin:
            # Use the sealed login from apps/monitoring, rather than a password the
            # chart makes up again every time Argo CD renders it.
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
        # kind keeps these control-plane parts unreachable (Lesson 1), so their targets
        # are always down and their alerts always fire. Stop scraping them (Lesson 7).
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            # And drop the alert rules about them.
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
          disabled:
            # kind's nodes don't sync their clocks; nothing to act on, here.
            NodeClockNotSynchronising: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Some of the chart's definitions are too large for the older way of applying,
      # as with Argo CD's own install in the Argo CD track's Lesson 1.
      - ServerSideApply=true
