# Monitoring (Monitoring track, Lesson 1): Prometheus, Alertmanager, Grafana and the
# exporters that feed them, from the kube-prometheus-stack Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.18.0
    helm:
      releaseName: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Some of the chart's definitions are too large for the older way of applying,
      # as with Argo CD's own install in the Argo CD track's Lesson 1.
      - ServerSideApply=true
