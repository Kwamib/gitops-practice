# A private certificate authority for this cluster (Security track, Lesson 8).
# 1. selfsigned: an issuer that signs a certificate with its own key. Used once, for the CA.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# 2. The root CA's certificate and private key, in the Secret practice-root-ca.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: practice-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: gitops-practice root CA
  secretName: practice-root-ca
  duration: 87600h   # 10 years: a root changes rarely, and every client has to trust it
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# 3. practice-ca: signs certificates for apps, with the root's key.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: practice-ca
spec:
  ca:
    secretName: practice-root-ca
