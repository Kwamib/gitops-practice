# The bookshop's home page. Made from site/index.html with:
#   kubectl create configmap bookshop-page --from-file=index.html=site/index.html --dry-run=client -o yaml
apiVersion: v1
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Bookshop</title>
    <style>
      :root {
        --paper: #fbf7f0; --ink: #2b2320; --muted: #6f625a; --line: #e6dccd;
        --accent: #9a3b2e; --accent-soft: #f3e2dc; --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1c1816; --ink: #f1e9df; --muted: #b5a798; --line: #3a322d;
          --accent: #e08a74; --accent-soft: #3a2621; --card: #241f1c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--paper); color: var(--ink);
        font: 17px/1.6 Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      }
      .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
      header { border-bottom: 1px solid var(--line); }
      .bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: bold; letter-spacing: .3px; }
      .mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #fff;
              display: grid; place-items: center; font-size: 18px; }
      nav { display: flex; gap: 18px; font: 15px/1 -apple-system, "Segoe UI", sans-serif; color: var(--muted); }
      .hero { padding: 56px 0 40px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; }
      .hero h1 { font-size: 46px; line-height: 1.1; margin: 0 0 14px; }
      .hero p { color: var(--muted); font-size: 19px; margin: 0 0 22px; max-width: 34ch; }
      .btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
             padding: 12px 20px; border-radius: 999px; font: 600 15px/1 -apple-system, "Segoe UI", sans-serif; }
      .shelf { display: flex; align-items: flex-end; gap: 8px; height: 220px; padding: 0 12px;
               border-bottom: 10px solid #7a5a43; }
      .spine { flex: 1; max-width: 38px; border-radius: 4px 4px 0 0; box-shadow: inset -6px 0 0 rgba(0,0,0,.12); }
      .s1 { height: 78%; background: #9a3b2e; } .s2 { height: 92%; background: #2f5d62; }
      .s3 { height: 70%; background: #c9a227; } .s4 { height: 86%; background: #4a4e8a; }
      .s5 { height: 64%; background: #6b8f4e; } .s6 { height: 96%; background: #8a4f7d; }
      .s7 { height: 74%; background: #c46a3a; } .s8 { height: 84%; background: #35424d; }
      h2 { font-size: 28px; margin: 0 0 6px; }
      .sub { color: var(--muted); margin: 0 0 24px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding-bottom: 56px; }
      .book { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
              display: flex; flex-direction: column; gap: 10px; }
      .cover { height: 150px; border-radius: 8px; display: flex; align-items: flex-end; padding: 14px;
               color: #fff; font-weight: bold; font-size: 18px; line-height: 1.25; }
      .c1 { background: linear-gradient(135deg, #2f5d62, #1f3d41); }
      .c2 { background: linear-gradient(135deg, #9a3b2e, #6c271e); }
      .c3 { background: linear-gradient(135deg, #4a4e8a, #2f3260); }
      .c4 { background: linear-gradient(135deg, #6b8f4e, #45602f); }
      .c5 { background: linear-gradient(135deg, #c46a3a, #8f4522); }
      .c6 { background: linear-gradient(135deg, #35424d, #1f282f); }
      .title { font-weight: bold; font-size: 17px; margin: 0; }
      .author { color: var(--muted); font-size: 15px; margin: 0; }
      .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto;
             font: 15px/1 -apple-system, "Segoe UI", sans-serif; }
      .price { font-weight: 700; }
      .stock { background: var(--accent-soft); color: var(--accent); padding: 5px 10px; border-radius: 999px; font-size: 13px; }
      footer { border-top: 1px solid var(--line); color: var(--muted);
               font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
      footer .wrap { display: flex; justify-content: space-between; gap: 16px; padding: 20px; flex-wrap: wrap; }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
      @media (max-width: 760px) {
        .hero { grid-template-columns: 1fr; padding: 36px 0 28px; }
        .hero h1 { font-size: 36px; }
        .shelf { height: 160px; }
        .grid { grid-template-columns: 1fr; }
        nav { display: none; }
      }
      @media (min-width: 761px) and (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
    </head>
    <body>
    <header>
      <div class="wrap bar">
        <div class="brand"><span class="mark">B</span> The Bookshop</div>
        <nav><span>New in</span><span>Staff picks</span><span>Visit us</span></nav>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <div>
          <h1>Books for people who run things.</h1>
          <p>A small shop for the curious: systems, software and the people who keep them going.</p>
          <a class="btn" href="#picks">See staff picks</a>
        </div>
        <div class="shelf" aria-hidden="true">
          <div class="spine s1"></div><div class="spine s2"></div><div class="spine s3"></div><div class="spine s4"></div>
          <div class="spine s5"></div><div class="spine s6"></div><div class="spine s7"></div><div class="spine s8"></div>
        </div>
      </section>

      <section id="picks">
        <h2>Staff picks</h2>
        <p class="sub">Chosen by Sam, who owns the shop.</p>
        <div class="grid">
          <article class="book">
            <div class="cover c1">The Linux Command Line</div>
            <p class="title">The Linux Command Line</p>
            <p class="author">William Shotts</p>
            <div class="row"><span class="price">$29</span><span class="stock">4 in stock</span></div>
          </article>
          <article class="book">
            <div class="cover c2">Designing Data-Intensive Applications</div>
            <p class="title">Designing Data-Intensive Applications</p>
            <p class="author">Martin Kleppmann</p>
            <div class="row"><span class="price">$49</span><span class="stock">2 in stock</span></div>
          </article>
          <article class="book">
            <div class="cover c3">The Phoenix Project</div>
            <p class="title">The Phoenix Project</p>
            <p class="author">Gene Kim, Kevin Behr and George Spafford</p>
            <div class="row"><span class="price">$25</span><span class="stock">7 in stock</span></div>
          </article>
          <article class="book">
            <div class="cover c4">Site Reliability Engineering</div>
            <p class="title">Site Reliability Engineering</p>
            <p class="author">Edited by Betsy Beyer and others</p>
            <div class="row"><span class="price">$45</span><span class="stock">3 in stock</span></div>
          </article>
          <article class="book">
            <div class="cover c5">Kubernetes: Up and Running</div>
            <p class="title">Kubernetes: Up and Running</p>
            <p class="author">Brendan Burns and others</p>
            <div class="row"><span class="price">$55</span><span class="stock">5 in stock</span></div>
          </article>
          <article class="book">
            <div class="cover c6">Accelerate</div>
            <p class="title">Accelerate</p>
            <p class="author">Nicole Forsgren, Jez Humble and Gene Kim</p>
            <div class="row"><span class="price">$28</span><span class="stock">6 in stock</span></div>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <span>The Bookshop, a practice app for the kwamib.dev tracks.</span>
        <span>Deployed by Argo CD from <code>gitops-practice</code>. Version 1.</span>
      </div>
    </footer>
    </body>
    </html>
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: bookshop-page
