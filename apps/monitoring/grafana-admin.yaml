# Grafana's admin login (Monitoring track, Lesson 1), sealed for the monitoring namespace.
# The real password is in .grafana-admin, which never goes in Git.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      creationTimestamp: null
      name: grafana-admin
      namespace: monitoring
