# Least privilege for monitoring (Security track, Lesson 9).
# Alloy follows pod logs: it needs to find pods and read their logs. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-read-logs
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-read-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-read-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
# Grafana's sidecars load dashboards and data sources from labelled ConfigMaps in any
# namespace. The chart binds Grafana to this role (rbac.useExistingClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-read-configmaps
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
