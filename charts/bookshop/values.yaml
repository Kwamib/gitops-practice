# Settings for the bookshop chart. Override any of them with -f FILE or --set.

replicas: 2

image:
  repository: nginx
  tag: "1.28"

shop:
  name: The Bookshop
  headline: Books for people who keep things running.
  version: "1"
  banner: ""        # a line across the top of the page; empty means none

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

db:
  encryptedPassword: ""   # from kubeseal --raw, for this environment's namespace; empty means none

metrics:
  enabled: true     # nginx's status page, an exporter next to nginx, and a ServiceMonitor
  image:
    repository: nginx/nginx-prometheus-exporter
    tag: "1.5.3"
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 32Mi
  serviceMonitor:
    labels:           # extra labels for the ServiceMonitor
      release: monitoring   # kube-prometheus-stack's Prometheus only picks up ServiceMonitors with this

tls:
  enabled: false        # HTTPS on 443, with a certificate from cert-manager (Security track, Lesson 8)
  issuer: practice-ca   # the ClusterIssuer that signs it
  duration: 24h         # short on purpose, so renewal happens often enough to see
  renewBefore: 8h

hardened: false         # non-root, read-only, no capabilities, no API token (Security track, Lesson 9)

networkPolicy:
  enabled: false        # only the monitoring namespace may connect (Security track, Lesson 9)
