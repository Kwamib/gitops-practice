# Settings for the bookshop chart. Override any of them with -f FILE or --set.

replicas: 2

image:
  repository: nginx
  tag: "1.28"

shop:
  name: The Bookshop
  headline: Books for people who keep things running.
  version: "1"
  banner: ""        # a line across the top of the page; empty means none

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

db:
  encryptedPassword: ""   # from kubeseal --raw, for this environment's namespace; empty means none
