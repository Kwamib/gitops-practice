{{- if .Values.networkPolicy.enabled }}
# Who may connect to the bookshop (Security track, Lesson 9): only the monitoring namespace,
# where Prometheus scrapes it and the blackbox exporter probes it. Everything else is refused.
# (In real use, add the ingress controller's namespace here too.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "bookshop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
{{- end }}
