{{- if .Values.tls.enabled }}
# The bookshop's TLS certificate (Security track, Lesson 8). cert-manager keeps it in the
# Secret <release>-tls, and replaces it before it expires.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "bookshop.labels" . | nindent 4 }}
spec:
  secretName: {{ .Release.Name }}-tls
  duration: {{ .Values.tls.duration }}
  renewBefore: {{ .Values.tls.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always   # a new key with every certificate
  # Every name a client in the cluster might use for the Service.
  dnsNames:
    - {{ .Release.Name }}
    - {{ .Release.Name }}.{{ .Release.Namespace }}
    - {{ .Release.Name }}.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.tls.issuer }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
