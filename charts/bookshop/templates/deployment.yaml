# The bookshop website: nginx, serving the page from the ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "bookshop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      annotations:
        # Changes whenever the page changes, so a new page rolls the pods.
        checksum/page: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        checksum/nginx-conf: {{ include (print $.Template.BasePath "/nginx-conf.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        checksum/tls-conf: {{ include (print $.Template.BasePath "/tls-conf.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "bookshop.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
            {{- if .Values.tls.enabled }}
            - containerPort: 443
            {{- end }}
          {{- if .Values.db.encryptedPassword }}
          env:
            # From the Secret the Sealed Secrets controller makes (Lesson 10).
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db
                  key: password
          {{- end }}
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            {{- if .Values.metrics.enabled }}
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/status.conf
              subPath: status.conf
            {{- end }}
            {{- if .Values.tls.enabled }}
            # HTTPS (Security track, Lesson 8): the server block, and the certificate and key.
            - name: tls-conf
              mountPath: /etc/nginx/conf.d/tls.conf
              subPath: tls.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
          lifecycle:
            preStop:
              # Keep answering for a few seconds after being told to stop, while the
              # Service catches up and stops sending this pod new requests.
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.metrics.enabled }}
        # Reads nginx's status page and serves it as Prometheus metrics (Monitoring track, Lesson 4).
        - name: exporter
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          args:
            - --nginx.scrape-uri=http://localhost:8080/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}-page
        {{- if .Values.metrics.enabled }}
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-nginx-conf
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-conf
          configMap:
            name: {{ .Release.Name }}-tls-conf
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-tls
        {{- end }}
