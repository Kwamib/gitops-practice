# A stable address for the bookshop pods, inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "bookshop.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bookshop.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 80
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9113
      targetPort: metrics
    {{- end }}
