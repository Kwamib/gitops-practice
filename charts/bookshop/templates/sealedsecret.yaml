{{- /* The database password, encrypted for this environment's namespace (Lesson 10).
       The Sealed Secrets controller decrypts it into a Secret of the same name. */ -}}
{{- if .Values.db.encryptedPassword }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "bookshop.labels" . | nindent 4 }}
spec:
  encryptedData:
    password: {{ .Values.db.encryptedPassword }}
  template:
    metadata:
      name: {{ .Release.Name }}-db
{{- end }}
